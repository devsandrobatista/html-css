<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        /* declarações gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100vw;
            height: 100vh;
            background-color: #233eff;
            background-size: contain;
            background-repeat: no-repeat;
        }

        h1 {
            color: #fff;
            font-size: 2.5em;
            text-align: center;
            text-shadow: 3px 3px 0px #1526a7;
            text-transform: uppercase;
            padding: 10px;
        }

        @keyframes modos {
            from {
                color: #f4cb00;
                transform: scale(1);
            }

            to {
                color: #cab968;
                transform: scale(1.2);
            }
        }

        .modo {
            color: #f4cb00;
            font-size: .90em;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #1526a7;

            animation: modos 1s infinite alternate;

            position: absolute;
            top: 0;
        }

        /* declarações retrato */
        @media screen and (orientation: portrait) {
            body {
                background-image: url("assets/images/cev-portrait.jpg");
                background-position: center bottom;
            }

            .modo.retrato {
                position: absolute;
                left: 72%;
            }

            .modo.paisagem {
                display: none;
            }
        }

        /* declarações paisagem */
        @media screen and (orientation: landscape) {

            html,
            body {
                background-image: url("assets/images/cev-landscape.jpg");
                background-position: left bottom;
            }

            .modo.retrato {
                display: none;
            }

            .modo.paisagem {
                position: absolute;
                left: 80%;
            }
        }
    </style>
</head>

<body>
    <h1>Mude a orientação do seu dispositivo</h1>
    <div class="modos-orientacao">
        <p class="modo retrato">modo retrato</p>
        <p class="modo paisagem">modo paisagem</p>
    </div>
</body>

</html>
