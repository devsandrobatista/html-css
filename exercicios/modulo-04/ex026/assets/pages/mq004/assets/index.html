<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css" media="all">
    <link rel="stylesheet" href="css/media-query.css">
</head>
<body>
    <main>
        <h1>Testando Media Queries</h1>
        <img class="ico-devices" id="phone" src="images/icon-phone.png" alt=" Acessando via smartphone" title="Smartphone">
        <img class="ico-devices" id="tablet" src="images/icon-tablet.png" alt="Acessando via tablet" title="Tablet">
        <img class="ico-devices" id="print" src="images/icon-print.png" alt="Versão para impressão" title="Impressora">
        <img class="ico-devices" id="pc" src="images/icon-pc.png" alt="Acessando via desktop" title="Desktop">
        <img class="ico-devices" id="tv" src="images/icon-tv.png" alt="Acessando via TV" title="TV">
        <div class="container-versions">
            Você está na versão de:
            <div class="vs phone">
                <p class="content">Celular</p>
            </div>
            <div class="vs tablet">
                <p class="content">Tablet</p>
            </div>
            <div class="vs print">
                <p class="content">Impressão</p>
            </div>
            <div class="vs pc">
                <p class="content">Desktop</p>
            </div>
            <div class="vs tv">
                <p class="content">TV</p>
            </div>
        </div>
    </main>
</body>
</html>
