<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="#" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" value="M" id="isxmas"><label for="isxmas">Masculino</label>
            <input type="radio" name="sexo" value="F" id="isxfem"><label for="isxfem">Feminino</label>
            <input type="radio" name="sexo" value="N" id="isxnao"><label for="isxnao">Não Informar</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esbas" value="Basquete" id="iesbas"><label for="iesbas">Basquete</label>
            <input type="checkbox" name="esfut" value="Futebol" id="iesfut"><label for="iesfut">Futebol</label>
            <input type="checkbox" name="esnat" value="Natação" id="iesnat"><label for="iesnat">Natação</label>
            <input type="checkbox" name="esten" value="Tênis" id="iesten"><label for="iesten">Tênis</label>
        </fieldset>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
