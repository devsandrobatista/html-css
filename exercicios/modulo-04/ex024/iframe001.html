<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
        body {
            background-color: black;
            color: white;
        }

        iframe {
            width: 400px;
            height: 400px;
            outline: 1px solid red;
            outline-offset: 5px;
            border-radius: 15px;                                   
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    
    <!-- Tamanho padrão do iframe: 300x150 -->
    <p>
        Acessando o site do  
        <iframe src="https://www.cursoemvideo.com/curso/" frameborder="0" scrolling="no">
            <a href="https://www.cursoemvideo.com/curso/" target="_blank">Curso em Video</a>
        </iframe>
        para aprender a programar.
    </p>
    <p>
        O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            no <a href="https://gustavoguanabara.github.io">GitHub</a>
        </iframe>
        também é muito legal!
    </p>
</body>
</html>
