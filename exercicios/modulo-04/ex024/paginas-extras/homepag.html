<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Teste</title>
    <style>
        @keyframes backgroundmove {
            from {background-color: #023859;}
            to {background-color: #50A0BF;}
        }

        @keyframes textmove {
            from {color: white; text-shadow: 1px 2px 3px red; border: 2px solid red;}
            to {color: red; text-shadow: 1px 2px 3px white; border: 1px solid white;}
        }

        * {
            padding: 0;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #023859;
            animation: backgroundmove 3s alternate infinite;
        }

        h1 {
            background-color: rgb(0, 0, 0, .35);
            box-shadow: 1px 1px 10px rgb(0, 0, 0, .3);
            border: 1px solid red;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            padding: 15px;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            animation: textmove .6s alternate infinite;

            color: white;
            font-size: 3.5em;
            text-shadow: 1px 2px 3px red;
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>Isso é um teste!</h1>
</body>
</html>
