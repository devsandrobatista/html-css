<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="#" method="get">
        <div>
            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor" value="#00000000">
        </div>
        <div>
            <label for="inivel">Nível de Satisfação</label>
            <input type="range" name="nivel" id="inivel" max="5" oninput="inum.innerHTML = Number(inivel.value)">
            <output id="inum">5</output>
        </div>
        <div>
            <label for="ifoto">Foto de Perfil</label>
            <input type="file" name="foto" id="ifoto">
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar"> 
        </div>
    </form>
    <img src="https://via.placeholder.com/300x200" alt="">
</body>
</html>
