<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout na prática</title>

    <style>
      /* R E S E T */
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      /* S T Y L E S */
      .container {
        height: 250px;
        border: 3px solid #00f;

        display: grid;
        grid-template: repeat(3, auto) / repeat(3, auto);
        place-items: start center;
        place-content: space-between end;
      }

      .item {
        padding: 5px;
        border: 3px solid rgba(255, 0, 0);

        /* color: #fff; */
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item i1">A</div>
      <div class="item i2">B</div>
      <div class="item i3">C</div>
      <div class="item i4">D</div>
      <div class="item i5">E</div>
      <div class="item i6">F</div>
      <div class="item i7">G</div>
      <!-- <div class="item i8">H</div>
      <div class="item i9">J</div> -->
    </div>
  </body>
</html>
