<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      .container {
        width: 100vw;
        background-color: lightsalmon;
        display: flex;
        flex-flow: row nowrap;
      }

      .item {
        background-color: lightblue;
        border: 1px solid #000;
        text-align: center;

        flex-basis: 200px;
      }

      .i1 {
        flex-grow: 0;
        flex-shrink: 1;
      }
      .i2 {
        flex-grow: 1;
        flex-shrink: 1;
      }
      .i3 {
        flex-grow: 0;
        flex-shrink: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item i1">a</div>
      <div class="item i2">b</div>
      <div class="item i3">c</div>
    </div>
  </body>
</html>
